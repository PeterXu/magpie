# IceTurn Configuration

realm: iceturn.local

# Listening addresses
listen_udp: ":3478"
listen_tcp: ":3478"

# Public IP for relay address (will be overridden by env var)
public_ip: "127.0.0.1"

# STUN packet buffering timeout
stun_pending_timeout: 30s

# Authentication credentials (defaults)
credentials:
  iceturn: "iceturn"
