<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>clipboard test</title></head>
<body>
  <input id="txt" style="position:absolute;left:100px;top:100px;width:200px;height:40px;" autofocus />
  <script>
    // Ensure input is focused on load
    window.addEventListener('load', () => {
      document.getElementById('txt').focus();
    });
  </script>
</body>
</html>
