# coturn config for magpie (STUN + TURN on 3478). user/external-ip are passed
# via CLI from env so magpie and coturn share one source of truth.
listening-port=3478
listening-ip=0.0.0.0
fingerprint
lt-cred-mech
realm=magpie
min-port=49160
max-port=49200
no-cli
no-tls
no-dtls

# 激活详细日志到stdout
log-stdout
verbose

# 明确设置无限制，避免默认值问题
user-quota=0
total-quota=0
max-bps=0

# nonce生命周期保持默认600秒，避免认证过期
stale-nonce=600
channel-lifetime=600
permission-lifetime=300
no-software-attribute
