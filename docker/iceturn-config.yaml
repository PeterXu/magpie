# IceTurn Configuration

realm: magpie.local

# Listening addresses
listen_udp: ":3478"
listen_tcp: ":3478"

# Public IP for relay address (will be overridden by env var)
public_ip: "127.0.0.1"

# STUN packet buffering timeout
stun_pending_timeout: 30s

# Authentication credentials (match magpie defaults)
credentials:
  magpie: "magpie"
  streamer-1: "password1"
  streamer-2: "password2"
  client-1: "password3"
  client-2: "password4"