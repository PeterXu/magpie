services:
  magpie:
    build: .
    # Publish 8080 on the host (reachable on macOS and Linux). With this bridge
    # setup, WebRTC video reaches a browser ON THE SAME Linux host (its docker
    # bridge 172.x is host-routable). For LAN/remote clients switch to
    # network_mode: host (Linux) — see README "Networking".
    ports:
      - "8080:8080"
    shm_size: 2gb            # Chromium stability (default 64MB /dev/shm can crash)
    # Auto-load the host .env into the container environment (every MAGPIE_*
    # video/quality var + MAGPIE_HOST_IP, etc.). required:false means no error
    # when .env is absent. `environment:` below still takes precedence, so the
    # Docker-essential values (NO_SANDBOX, HOST, PORT) stay fixed.
    env_file:
      - path: .env
        required: false
    environment:
      - MAGPIE_URL=https://gitee.com
      - MAGPIE_NO_SANDBOX=1
      - HOST=0.0.0.0
      - PORT=8080
      - MAGPIE_HOST_IP=${MAGPIE_HOST_IP:-}
      - MAGPIE_TURN_USER=${MAGPIE_TURN_USER:-magpie}
      - MAGPIE_TURN_PASS=${MAGPIE_TURN_PASS:-magpie}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:latest
    command:
      - "-c"
      - "/turnserver.conf"
      - "--user"
      - "${MAGPIE_TURN_USER:-magpie}:${MAGPIE_TURN_PASS:-magpie}"
      - "--external-ip"
      - "${MAGPIE_HOST_IP:-127.0.0.1}"
    volumes:
      - "./docker/turnserver.conf:/turnserver.conf:ro"
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
