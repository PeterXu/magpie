services:
  magpie:
    build: .
    # Publish 8080 on the host (reachable on macOS and Linux). With this bridge
    # setup, WebRTC video reaches a browser ON THE SAME Linux host (its docker
    # bridge 172.x is host-routable). For LAN/remote clients switch to
    # network_mode: host (Linux) — see README "Networking".
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    shm_size: 2gb            # Chromium stability (default 64MB /dev/shm can crash)
    # Explicit environment variables (no env_file for clarity and security).
    # Only variables listed here enter the container. User can override via host .env.
    environment:
      # Docker 安全配置（硬编码，不可覆盖）
      - MAGPIE_NO_SANDBOX=1
      - MAGPIE_DEBUG_STREAMER=${MAGPIE_DEBUG_STREAMER:-1}
      - MAGPIE_IDLE_TIMEOUT=${MAGPIE_IDLE_TIMEOUT:-30}
      # 服务器配置（可从 .env 覆盖）
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8080}
      # 用户可配置项（从宿主机 .env 读取，或使用默认值）
      - MAGPIE_URL=${MAGPIE_URL:-about:blank}
      - MAGPIE_WIDTH=${MAGPIE_WIDTH:-1280}
      - MAGPIE_HEIGHT=${MAGPIE_HEIGHT:-800}
      - MAGPIE_QUALITY=${MAGPIE_QUALITY:-80}
      - MAGPIE_FPS=${MAGPIE_FPS:-10}
      - MAGPIE_MAX_BITRATE=${MAGPIE_MAX_BITRATE:-}
      - MAGPIE_MAX_FRAMERATE=${MAGPIE_MAX_FRAMERATE:-}
      - MAGPIE_DEGRADATION=${MAGPIE_DEGRADATION:-maintain-resolution}
      - MAGPIE_HOST_IP=${MAGPIE_HOST_IP:-}
      - MAGPIE_TURN_HOST=${MAGPIE_TURN_HOST:-iceturn}
      - MAGPIE_TURN_USER=${MAGPIE_TURN_USER:-magpie}
      - MAGPIE_TURN_PASS=${MAGPIE_TURN_PASS:-magpie}
      - MAGPIE_ADMIN_USER=${MAGPIE_ADMIN_USER:-admin}
      - MAGPIE_ADMIN_PASSWORD=${MAGPIE_ADMIN_PASSWORD:-pass123}
      - MAGPIE_JWT_SECRET=${MAGPIE_JWT_SECRET:-random-string}
      - MAGPIE_JWT_EXPIRES_IN=${MAGPIE_JWT_EXPIRES_IN:-86400}
    restart: unless-stopped
    depends_on:
      iceturn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||'8080')+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - magpie-network

  iceturn:
    build:
      context: ./iceturn
      dockerfile: Dockerfile
    volumes:
      - ./iceturn/config.yaml:/app/config.yaml:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    environment:
      - REALM=magpie.local
      - PUBLIC_IP=${MAGPIE_HOST_IP:-127.0.0.1}
      - TURN_CREDENTIALS=${MAGPIE_TURN_USER:-magpie}:${MAGPIE_TURN_PASS:-magpie}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 3478 && nc -zu -w1 localhost 3478"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - magpie-network

networks:
  magpie-network:
    driver: bridge
