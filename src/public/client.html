<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>magpie</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden;
           font: 13px sans-serif; }
    /* Browser-style chrome: full-width toolbar on top, video body below.
       body is a flex column; #bar takes its natural height, #stage fills the
       rest. #v scales to fit #stage preserving aspect, so its element box
       equals its content box (no in-element letterboxing) — keeping the
       no-letterbox assumption in coords.js / mapClientToPage valid. */
    #bar { flex: 0 0 auto; display: flex; gap: 6px; align-items: center;
           background: #222; color: #eee; padding: 6px 8px; border-bottom: 1px solid #000; }
    #bar button { background: #333; color: #eee; border: 1px solid #444;
                 border-radius: 4px; padding: 4px 9px; cursor: pointer;
                 font-size: 14px; line-height: 1; }
    #bar button:hover:not(:disabled) { background: #444; }
    #bar button:disabled { opacity: 0.35; cursor: default; }
    #url { flex: 1 1 auto; min-width: 0; background: #111; color: #eee;
           border: 1px solid #444; border-radius: 4px; padding: 5px 8px;
           font: 13px sans-serif; }
    #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
             overflow: hidden; }
    #v { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block;
         cursor: url("/cursor.svg") 2 2, default; }
    /* cursor.svg: teal arrow + dot — distinct from the macOS/Windows default
       arrows and an instant cue that the pointer is over the remote video.
       hotspot (2,2) = arrow tip; `default` is just a load-failure fallback. */
  </style>
</head>
<body>
  <div id="bar">
    <button id="back" title="Back" aria-label="Back" disabled>◀</button>
    <button id="fwd" title="Forward" aria-label="Forward" disabled>▶</button>
    <button id="refresh" title="Reload" aria-label="Reload">⟳</button>
    <input id="url" placeholder="https://..." />
    <button id="go">Go</button>
  </div>
  <div id="stage">
    <video id="v" autoplay playsinline muted></video>
  </div>
  <script type="module">
    import { pickCodec } from "/codec-pick.js";
    const video = document.getElementById("v");
    const urlInput = document.getElementById("url");
    const goBtn = document.getElementById("go");
    const backBtn = document.getElementById("back");
    const fwdBtn = document.getElementById("fwd");
    const refreshBtn = document.getElementById("refresh");
    let pc = null;

    // Server-reported nav state → URL bar + back/forward disabled state.
    // Always applied (even while editing): right after Go the resolved URL
    // (after redirect) should replace the typed text; a passive nav clobbering
    // a half-typed draft is rare and harmless.
    function applyNav(nav) {
      if (nav && typeof nav.url === "string") urlInput.value = nav.url;
      backBtn.disabled = !nav || !nav.canBack;
      fwdBtn.disabled = !nav || !nav.canForward;
    }

    function connect() {
      const ws = new WebSocket(location.origin.replace(/^http/, "ws") + "/signaling");
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.t === "hello") {
          applyNav({ url: msg.url, canBack: msg.canBack, canForward: msg.canForward });
          window._iceServers = msg.iceServers || [];
          window._magpieCodecs = msg.magpieCodecs || [];
          if (!pc) startPeer();                 // start AFTER we have iceServers + magpieCodecs
        }
        else if (msg.t === "nav") applyNav(msg);  // URL + button state after any navigation
        else if (msg.t === "answer") pc.setRemoteDescription({ type: "answer", sdp: msg.sdp }).then(attachReceiver);
        else if (msg.t === "reload") location.reload();  // crash recovery: reload the CLIENT page
      };
      ws.onclose = () => setTimeout(connect, 1000);
      window._ws = ws;
    }

    // Offerer-side codec selection. The encoder follows the OFFER's m-line order,
    // so this MUST happen on the client (offerer), not the streamer. Narrow the
    // video m-line to the single codec both magpie and this client support, per
    // the fixed chain [av1,vp9,vp8,h264]. No-op if none mutually supported.
    function narrowCodec(tr) {
      try {
        const recv = RTCRtpReceiver.getCapabilities("video");
        if (!recv || !recv.codecs) return;
        const clientSet = [...new Set(recv.codecs.map((c) => (c.mimeType.split("/")[1] || "").toLowerCase()))];
        const picked = pickCodec(window._magpieCodecs || [], clientSet);
        if (!picked) return;
        const want = recv.codecs.filter((c) => (c.mimeType.split("/")[1] || "").toLowerCase() === picked);
        const rtx = recv.codecs.filter((c) => c.mimeType === "video/rtx");
        tr.setCodecPreferences([...want, ...rtx]);
      } catch (e) { console.warn("magpie: codec narrow failed", e); }
    }

    async function startPeer() {
      const iceServers = window._iceServers || [];
      const relay = new URLSearchParams(location.search).get("relay") === "1";
      const rtcConfig = { iceServers };
      if (relay) rtcConfig.iceTransportPolicy = "relay";
      pc = new RTCPeerConnection(rtcConfig);
      const transceiver = pc.addTransceiver("video", { direction: "recvonly" });
      narrowCodec(transceiver);               // offerer-side: force single preferred codec
      pc.ontrack = (e) => { video.srcObject = e.streams[0]; };
      await pc.setLocalDescription(await pc.createOffer());
      // Wait for ICE gathering so the TURN relay candidate is included in the
      // offer (TURN allocation is a round-trip; sending early omits it).
      await waitForIceGathering(pc);
      window._lastOffer = pc.localDescription.sdp;   // debug aid for verification
      window._ws.send(JSON.stringify({ t: "offer", sdp: pc.localDescription.sdp }));
    }

    function waitForIceGathering(pc, timeoutMs = 5000) {
      if (pc.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve) => {
        const timer = setTimeout(resolve, timeoutMs);
        pc.addEventListener("icegatheringstatechange", () => {
          if (pc.iceGatheringState === "complete") { clearTimeout(timer); resolve(); }
        });
      });
    }

    // ontrack is unreliable in headless Chromium; poll-attach the receiver track as a fallback.
    async function attachReceiver() {
      for (let i = 0; i < 50; i++) {
        const r = pc.getReceivers().find((r) => r.track && r.track.kind === "video");
        if (r && r.track) { if (!video.srcObject) video.srcObject = new MediaStream([r.track]); return; }
        await new Promise((res) => setTimeout(res, 100));
      }
    }

    function send(obj) { if (window._ws && window._ws.readyState === 1) window._ws.send(JSON.stringify(obj)); }

    function coords(evt) {
      const r = video.getBoundingClientRect();
      return { x: evt.clientX - r.left, y: evt.clientY - r.top, displayW: r.width, displayH: r.height };
    }
    const btn = (b) => (b === 2 ? "right" : b === 1 ? "middle" : "left");

    video.addEventListener("mousemove", (e) => send({ t: "mouse", ...coords(e), type: "moved" }));
    video.addEventListener("mousedown", (e) => send({ t: "mouse", ...coords(e), type: "pressed", button: btn(e.button), clickCount: 1 }));
    video.addEventListener("mouseup", (e) => send({ t: "mouse", ...coords(e), type: "released", button: btn(e.button), clickCount: 1 }));
    video.addEventListener("wheel", (e) => { e.preventDefault(); send({ t: "wheel", ...coords(e), deltaX: e.deltaX, deltaY: e.deltaY }); });
    video.addEventListener("contextmenu", (e) => e.preventDefault());
    window.addEventListener("keydown", (e) => send({ t: "key", type: "keyDown", key: e.key, code: e.code, keyCode: e.keyCode, modifiers: 0 }));
    window.addEventListener("keyup", (e) => send({ t: "key", type: "keyUp", key: e.key, code: e.code, keyCode: e.keyCode, modifiers: 0 }));

    // Toolbar → server. "refresh" reloads the REMOTE page (the crash-recovery
    // "reload" broadcast up above reloads the CLIENT page — different directions).
    goBtn.addEventListener("click", () => send({ t: "navigate", url: urlInput.value }));
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") goBtn.click(); });
    backBtn.addEventListener("click", () => send({ t: "back" }));
    fwdBtn.addEventListener("click", () => send({ t: "forward" }));
    refreshBtn.addEventListener("click", () => send({ t: "refresh" }));

    connect();
  </script>
</body>
</html>
