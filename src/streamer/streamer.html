<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>magpie streamer</title></head>
<body>
<canvas id="c"></canvas>
<script src="/magpie-webrtc.js"></script>
<script>
  const console = MagpieWebrtc.logger;
  const canvas = document.getElementById("c");
  const wsUrl = location.origin.replace(/^http/, "ws") + "/internal";

  // Viewport + caps via query (?w=&h=&fps=&bitrate=&maxFps=&degradation=).
  const params = new URLSearchParams(location.search);
  const W = Number(params.get("w") || 1280);
  const H = Number(params.get("h") || 800);
  const FPS = Number(params.get("fps")) || 10;             // captureStream rate; default 10
  const BITRATE = Number(params.get("bitrate")) || 0;      // sender maxBitrate (bps); 0 = unset
  const MAXFPS = Number(params.get("maxFps")) || 0;        // sender maxFramerate; 0 = unset
  const DEGRADATION = params.get("degradation") || "";     // sender degradationPreference; "" = unset
  // Debug hook: parsed caps (matches the window.__* convention used elsewhere here).
  window.__magpieCfg = { FPS, BITRATE, MAXFPS, DEGRADATION };

  const options = {canvas, url: wsUrl, W, H, FPS, BITRATE, MAXFPS, DEGRADATION};
  let peer = new MagpieWebrtc.MagpiePeer();
  peer.setCanvasStream(options);

  window.relayOffer = async (message, iceServers) => {
    console.log(`[StreamerPage] receive remote offer from id=`, message.connectionId);
    let answer = await peer.relayOffer(message, iceServers, options);
    return answer;
  };

  window.__ready = true;
</script>
</body>
</html>
